<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wuxer AI</title>
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <h1>Wuxer AI</h1>
    <nav>
        <button data-tab="ask" class="on">Chiedi</button>
        <button data-tab="index">Indicizza</button>
        <button data-tab="eval">Valuta</button>
    </nav>

    <!-- CHIEDI -->
    <section id="ask" class="on">
        <textarea id="q-text" placeholder="La tua domanda"></textarea>
        <div class="row">
            <select id="q-category"></select>
            <select id="q-mode">
                <option>strict</option>
                <option>standard</option>
                <option>full</option>
            </select>
            <label>top-k <input id="q-topk" type="number" value="5" min="1" max="50" style="width:4rem"></label>
            <label><input type="checkbox" id="q-rerank"> re-ranking</label>
            <button id="q-go">Chiedi</button>
        </div>
        <div id="q-answer" class="pre"></div>
        <div id="q-info" class="muted"></div>
        <table id="q-chunks"></table>
    </section>

    <!-- INDICIZZA -->
    <section id="index">
        <div class="row">
            <label>Categoria <select id="i-category"></select></label>
            <label>Strategia <select id="i-strategy">
                    <option>sentence</option>
                    <option>word</option>
                </select></label>
            <label>Dimensione <input id="i-dimension" type="number" value="40" style="width:4rem"></label>
            <label>Overlap <input id="i-overlap" type="number" value="1" style="width:4rem"></label>
        </div>
        <div class="row"><label>File (.md, .pdf) <input id="i-files" type="file" multiple accept=".md,.pdf"></label>
        </div>
        <div class="row"><label style="flex:1">oppure cartella sul server <input id="i-folder" type="text"
                    placeholder="es. /content/drive/MyDrive/note"></label></div>
        <div class="row"><button id="i-go">Indicizza</button><span id="i-status" class="muted"></span></div>
        <h3>Contenuto del database</h3>
        <table id="i-sources"></table>
    </section>

    <!-- VALUTA -->
    <section id="eval">
        <h3>Prova una domanda</h3>
        <p class="muted">Vedi coseno e re-ranking affiancati sulla stessa domanda; se ti convince, salvala in
            <code>eval/questions.json</code>.</p>
        <textarea id="p-text" placeholder="Nuova domanda"></textarea>
        <div class="row">
            <select id="p-category"></select>
            <button id="p-go">Prova</button>
            <span id="p-status" class="muted"></span>
        </div>
        <div id="p-out" class="cols"></div>
        <div id="p-save" class="row" style="display:none">
            <label>Etichetta <select id="p-label">
                    <option>pertinente</option>
                    <option>borderline</option>
                    <option>fuori_tema</option>
                </select></label>
            <label style="flex:1">Fonte attesa (separate da virgola, facoltativa) <input id="p-source" type="text"
                    placeholder="il-caffe.md"></label>
            <button id="p-add">Salva domanda</button>
        </div>

        <h3>Esegui la valutazione</h3>
        <div class="row">
            <label><input type="checkbox" id="e-rerank" checked> anche con re-ranking</label>
            <button id="e-go">Esegui eval</button>
            <span id="e-status" class="muted"></span>
        </div>
        <div id="e-out"></div>
    </section>

    <script src="/index.js"></script>
</body>
</html>
